name: JS-tests

# The Traqula bundle's tests and the query rewrites of client/query-transforms.xsl, run on Saxon-JS over
# queries Traqula parses. Neither needs the platform, its image or a stack, so they run on their own and
# fail in seconds.

on: [push, pull_request]

jobs:
  sparql:
    name: Run the SPARQL bundle and query rewrite tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/main/js/sparql
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/main/js/sparql/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
